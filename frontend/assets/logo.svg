<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&amp;family=Caveat:wght@700&amp;display=swap');
    .serif-part {
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      font-size: 30px;
      fill: #223350;
      letter-spacing: -0.5px;
    }
    .hand-part {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 38px;
      fill: #B23A2E;
    }
    .submark {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      fill: #5E718D;
      text-transform: uppercase;
      font-weight: 600;
    }
    .pen-rule {
      stroke: #CBD4DC;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
  </style>
  <text x="8" y="38" class="serif-part">Asli</text>
  <text x="70" y="40" class="hand-part">Tulis</text>
  <line x1="8" y1="48" x2="160" y2="48" class="pen-rule" />
</svg>